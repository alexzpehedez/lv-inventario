<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Catálogo - LV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

  <h4 class="collection">COLLECTION 2024</h4>
  <h1 class="title">CONTROL DE INVENTARIO</h1>

  <input type="text" placeholder="Buscar producto..." class="search">

  <button class="outline">FILTROS</button>

  <div class="catalogo">

    <!-- PRODUCTO 1 -->
    <div class="producto">
      <img src="https://via.placeholder.com/300x200" alt="bolsa">

      <div class="info">
        <h3>NOIR STRUCTURED TOTE</h3>
        <p class="precio">$2,450.00</p>
        <span class="badge normal">STOCK: 12</span>
      </div>
    </div>

    <!-- PRODUCTO 2 -->
    <div class="producto">
      <img src="https://via.placeholder.com/300x200" alt="bufanda">

      <div class="info">
        <h3>HERITAGE SILK WRAP</h3>
        <p class="precio">$480.00</p>
        <span class="badge low">LOW STOCK: 3</span>
      </div>
    </div>

  </div>

</div>

<script src="js/main.js"></script>
</body>
</html>
